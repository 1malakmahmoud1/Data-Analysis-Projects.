services:
  - type: web
    name: malak-online-retail-dashboard
    runtime: python
    rootDir: Online-Retail-Sales
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn retail_dashboard:server --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
